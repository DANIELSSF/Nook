<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Nook</title>
  <desc id="desc">Your terminal, a gesture away. A compact dark island with a white cat and a sample terminal session.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101416"/><stop offset="1" stop-color="#192725"/></linearGradient>
